name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: yilan-2026-election
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::尚未設定 CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID，略過 Cloudflare Pages 部署"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Prepare site files
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p dist
          cp index.html dist/

      - name: Create Pages project (first run only)
        if: steps.check.outputs.ready == 'true'
        run: npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch main || echo "Project already exists"

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT_NAME" --branch main --commit-dirty=true
